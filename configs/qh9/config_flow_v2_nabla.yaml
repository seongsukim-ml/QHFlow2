hydra:
  run:
    dir: outputs/${dataset.dataset_full_name}/${wandb.run_name}

defaults:
  - model: QHFlow_so2_v5_1_nabla_small
  - dataset: NablaDFT
devices: 1
strategy: Null
ckpt_dir: 'checkpoints'
split_seed: 42
check_val_every_n_epoch: 1

optimizer: adamW
decay_factor: 0.5
decay_patience: 5
ema_start_epoch: -1
warmup_step: 1000
num_training_steps: ${dataset.total_steps}
end_lr: 1e-7
scheduler_power: 1.0

basis: "def2-svp-nabla"
qh9: True
pl_type: flow

data_type: float32
precision: 32

loss_weights: {"hamiltonian": 10.0}
loss_weights_detail: {"hamiltonian": {"mae": 1.0, "mse": 1.0}}
use_init_hamiltonian: True
use_init_hamiltonian_residue: True
use_mse_and_mae: True

prefix: "-nabla"
mode: train

wandb:
  mode: online
  project: "DFT-25-nablaDFT"
  entity: "kaist-korea"
  run_id: Null
  run_name: ${model.version}${prefix}-${dataset.dataset_full_name}
  tags: ["nabladft","flow","def2-svp-nabla"]

ckpt: ''
use_last_ckpt: True

partial_val: 0.25
seed: 0

flow:
  batch_mul: 1
  use_t_scale: False
  init_gauss: True
  init_gauss_center: False
  use_mse_and_mae: ${use_mse_and_mae}
  use_res_target: True
  error_threshold: 1e-3
  sigma: 0.1
  num_ode_steps: 3
  num_ode_steps_val: 1
  num_ode_steps_test: 3
  init_p0_type: "expand"
