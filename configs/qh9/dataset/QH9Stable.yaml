dataset_full_name: ${dataset.dataset_name}-${dataset.split}
dataset_name: QH9Stable
version: ''
split: random  #[random, size_ood]

use_shard: false
use_preprocessed: true   # single LMDB preprocessed dataset (14x faster dataloader)
preprocessed_lmdb: ''    # path to preprocessed LMDB (auto-detected if empty)
# Sharding dataset specific parameters
use_ref_hamiltonian_as_init_ham: false
return_orbital_and_energies: false
compute_q_tensor: false  # Q tensor not used by current model (OneBody_Reduction commented out)
include_initial_hamiltonian: true
include_overlap: true
include_dft_energy: false
include_dft_forces: false
include_cut_orbital_coefficients: true

batch_size: 32 # 32
train_batch_size: ${dataset.batch_size}
valid_batch_size: ${dataset.batch_size}
test_batch_size: ${dataset.batch_size}
# test_batch_size: 1

learning_rate: 5e-4
# learning_rate: 1e-3
validation_interval: 1
use_gradient_clipping: true
clip_norm: 1.0
pin_memory: true
num_workers: 8  # preprocessed LMDB + workers: 20x faster than nw=0

warmup_steps: 1000
total_steps: 260000 # 260000
lr_end: 1e-7

train_batch_interval: 100
validation_batch_interval: 1000
