dataset_full_name: QH9Density-${dataset.split}
dataset_name: QH9Density
split: random
source_lmdb: /home1/irteam/data-vol1/datasets/qh9_b3lyp5_with_density/data.lmdb
split_path: /home1/irteam/data-vol1/data/QH9_shard/QH9Stable_shard/processed_QH9Stable_random_12.json

# Feature flags
include_density_matrix: true
include_initial_density_matrix: true
include_initial_hamiltonian: true
include_overlap: true
include_dft_energy: false
include_dft_forces: false
