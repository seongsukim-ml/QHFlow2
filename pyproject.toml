[project]
name = "qhflow2"
version = "0.1.0"
description = "Equivariant Flow Matching for DFT Hamiltonian Prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Seongsu Kim", email = "seongsu.kim@kaist.ac.kr" },
]
keywords = ["DFT", "Hamiltonian", "equivariant", "flow-matching", "quantum-chemistry", "graph-neural-network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "e3nn>=0.5",
    "torch-scatter",
    "torch-cluster",
    "torch-geometric>=2.3",
    "numpy",
    "scipy",
    "tqdm",
    "rich",
]

[project.urls]
Homepage = "https://github.com/seongsukim-ml/QHFlow2"
Repository = "https://github.com/seongsukim-ml/QHFlow2"
Paper = "https://arxiv.org/abs/2602.16897"

[project.optional-dependencies]
training = [
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "omegaconf",
    "wandb",
    "torch-ema",
    "tensorboard",
    "pandas",
    "transformers",
]
data = [
    "lmdb",
    "apsw",
]
dft = [
    "pyscf>=2.4",
]
md = [
    "ase>=3.22",
]
fairchem = [
    "fairchem-core>=2.6",
]
all = [
    "qhflow2[training,data,dft,md,fairchem]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qhflow2"]

[tool.hatch.build.targets.sdist]
exclude = [
    "dataset/",
    "ckpts/",
    "_asset/",
    "src/outputs/",
    "*.lmdb",
    "*.mdb",
    "*.db",
    "*.tgz",
    "*.gif",
    "*.ipynb",
    "*.ckpt",
    "*.pt",
]
