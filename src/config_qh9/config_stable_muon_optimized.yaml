# Same architecture, objective and effective batch as config_stable_muon.
defaults:
  - config_stable_muon
  - _self_

muon:
  batched: true

dataset:
  # The Hamiltonian-only objective and orbital validation do not consume Q
  # tensors or pre-cut occupied coefficients. Compute orbital metrics from
  # H/S as before, without generating unused training features.
  compute_q_tensor: false
  include_cut_orbital_coefficients: false
  pin_memory: true
  persistent_workers: true
