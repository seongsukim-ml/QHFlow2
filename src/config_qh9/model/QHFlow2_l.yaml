# Fresh QH9Stable model: corrected packing, AO frame, spectral gating.
# Width/depth audited against published QH9Stable-random checkpoints (2026-10-21).
# Total parameters: 187,993,401; trainable: 187,993,145.
# The O(3) projection shares these weights; see docs/MODEL_CONFIGS.md.
model_name: QHFlow2-l-order-fixed
version: QHFlow2_order_fixed
hidden_size: 256
bottle_hidden_size: 64
num_gnn_layers: 4
num_ham_gnn_layers: 2
sh_lmax: 4
dataset_type: qh9
use_block_S: true
use_block_H: true
# The existing model factory reads this explicit flag.
use_block_H_fix: true

# Conservative microbatch; effective batch is 32 on one device.
train_batch_size: 4
accumulate_grad_batches: 8
