dataset_full_name: ${dataset.dataset_name}-${dataset.split}
dataset_name: QH9Stable
version: ''
split: random

use_shard: false
use_ref_hamiltonian_as_init_ham: false
return_orbital_and_energies: false
compute_q_tensor: true
include_initial_hamiltonian: true
include_overlap: true
include_dft_energy: false
include_dft_forces: false
include_cut_orbital_coefficients: true

batch_size: 128
train_batch_size: ${dataset.batch_size}
valid_batch_size: ${dataset.batch_size}
test_batch_size: ${dataset.batch_size}

learning_rate: 1e-3
validation_interval: 1
use_gradient_clipping: true
clip_norm: 1.0
pin_memory: False
num_workers: 4

warmup_steps: 1000
total_steps: 260000
lr_end: 1e-7

train_batch_interval: 100
validation_batch_interval: 1000
